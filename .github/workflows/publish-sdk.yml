# Publishes packages/sdk to npm as `gentlemail` when a tag sdk-vX.Y.Z is pushed.
# The tag must match the version in packages/sdk/package.json.
# Uses npm trusted publishing (OIDC): no token. On npmjs.com, the `gentlemail` package's
# Settings → Trusted publishing names this repository and this workflow file (publish-sdk.yml).
name: Publish SDK

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  id-token: write # trusted publishing: npm checks this run's identity instead of a token

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "sdk-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}" >&2
            exit 1
          fi
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1 && npm --version
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test
      # Provenance is attached automatically with trusted publishing.
      - run: npm publish --access public
