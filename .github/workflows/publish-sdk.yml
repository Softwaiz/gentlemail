# Publishes packages/sdk to npm as `gentlemail` when a tag sdk-vX.Y.Z is pushed.
# The tag must match the version in packages/sdk/package.json.
# Needs the repository secret NPM_TOKEN (an npm automation or granular token that can publish `gentlemail`).
name: Publish SDK

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  id-token: write # npm provenance: links the package to this workflow run

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "sdk-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
